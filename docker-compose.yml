version: '3.9'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: rat-dashboard:latest
    container_name: rat-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT:          5000
      HOST:          0.0.0.0
      NODE_ENV:      production
      PING_INTERVAL: 25000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (tune for your VPS)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus:   '1.0'
