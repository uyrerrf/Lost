name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy mode'
        required: true
        default: 'pm2'
        type: choice
        options: [pm2, docker, docker-compose]

# Prevent parallel deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR:      ${{ vars.APP_DIR || '/opt/rat-dashboard' }}
  APP_NAME:     rat-dashboard
  DOCKER_IMAGE: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}
  NODE_ENV:     production

jobs:
  # ──────────────────────────────────────────
  #  Run CI first — never deploy broken code
  # ──────────────────────────────────────────
  ci:
    name: Run CI before deploy
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────
  #  Build Docker image & push to registry
  # ──────────────────────────────────────────
  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # ──────────────────────────────────────────
  #  Deploy to VPS via SSH
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── PM2 mode (default) ─────────────────
      - name: Deploy — PM2
        if: ${{ github.event.inputs.mode != 'docker' && github.event.inputs.mode != 'docker-compose' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.VPS_PORT || 22 }}
          timeout:     60s
          script: |
            set -e

            # Pull latest code
            if [ -d "${{ env.APP_DIR }}" ]; then
              cd "${{ env.APP_DIR }}"
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            else
              git clone ${{ github.server_url }}/${{ github.repository }}.git "${{ env.APP_DIR }}"
              cd "${{ env.APP_DIR }}"
            fi

            # Install production deps only
            npm install --production --prefer-offline

            # Start or reload via PM2
            if pm2 describe "${{ env.APP_NAME }}" > /dev/null 2>&1; then
              pm2 reload "${{ env.APP_NAME }}" --update-env
            else
              pm2 start server.js \
                --name "${{ env.APP_NAME }}" \
                --max-memory-restart 512M \
                --restart-delay 2000 \
                --env production
            fi

            pm2 save

            # Health check after deploy
            sleep 3
            PORT=${PORT:-5000}
            curl -sf http://localhost:$PORT/health | grep -q '"status":"ok"'
            echo "Deploy OK — $(date)"

      # ── Docker mode ───────────────────────
      - name: Deploy — Docker
        if: ${{ github.event.inputs.mode == 'docker' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.VPS_PORT || 22 }}
          timeout:     120s
          script: |
            set -e

            # Login to registry
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }} \
              -u ${{ github.actor }} --password-stdin

            # Pull new image
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Graceful container replacement
            docker stop ${{ env.APP_NAME }} 2>/dev/null || true
            docker rm   ${{ env.APP_NAME }} 2>/dev/null || true

            docker run -d \
              --name    ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${PORT:-5000}:5000 \
              -e PORT=5000 \
              -e NODE_ENV=production \
              ${{ env.DOCKER_IMAGE }}:latest

            # Health check
            sleep 4
            curl -sf http://localhost:${PORT:-5000}/health | grep -q '"status":"ok"'
            echo "Docker deploy OK — $(date)"

      # ── Docker Compose mode ───────────────
      - name: Deploy — Docker Compose
        if: ${{ github.event.inputs.mode == 'docker-compose' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.VPS_PORT || 22 }}
          timeout:     120s
          script: |
            set -e

            cd "${{ env.APP_DIR }}"
            git pull origin ${{ github.ref_name }}

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }} \
              -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            sleep 4
            curl -sf http://localhost:${PORT:-5000}/health | grep -q '"status":"ok"'
            echo "Compose deploy OK — $(date)"

      # ── Post-deploy health check ──────────
      - name: Remote health check
        if: ${{ secrets.VPS_HOST != '' }}
        run: |
          sleep 5
          HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" \
            http://${{ secrets.VPS_HOST }}:${{ secrets.VPS_PORT_HTTP || 5000 }}/health \
            2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Remote health check passed (HTTP 200)"
          else
            echo "Remote health check returned HTTP $HTTP_CODE (server may be behind firewall)"
          fi
