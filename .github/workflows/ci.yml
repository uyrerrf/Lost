name: CI

on:
  push:
    branches: [main, master, dev, staging]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  #  Build & Test matrix
  # ──────────────────────────────────────────
  test:
    name: Test — Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # ── Install ──────────────────────────
      - name: Install dependencies
        run: npm install

      # ── Syntax checks ────────────────────
      - name: Syntax check — server.js
        run: node --check server.js

      # ── Structural validation ─────────────
      - name: Validate server structure
        run: |
          node -e "
          const fs = require('fs');
          const code = fs.readFileSync('server.js', 'utf8');
          const required = [
            ['/health',           'Health endpoint missing'],
            ['/api/devices',      'Device list endpoint missing'],
            ['/api/command',      'Command endpoint missing'],
            ['path: \"/ws\"',     'Device WebSocket path missing'],
            ['path: \"/panel\"',  'Panel WebSocket path missing'],
            ['isAlive',           'Heartbeat isAlive pattern missing'],
            [\"'pong'\",          'Pong listener missing'],
            ['SIGTERM',           'Graceful shutdown missing'],
            ['SIGINT',            'Graceful shutdown missing'],
            ['uncaughtException', 'Global error handler missing'],
            ['broadcastBinaryToWatchers', 'Binary forward function missing'],
            ['forwardToDevice',   'Command forward function missing'],
          ];
          let fail = 0;
          required.forEach(([needle, msg]) => {
            if (!code.includes(needle)) { console.error('FAIL:', msg); fail++; }
          });
          if (fail) process.exit(1);
          console.log('Server structure OK (' + required.length + ' checks)');
          "

      # ── HTML validation ───────────────────
      - name: Validate frontend HTML
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const required = [
            ['<!DOCTYPE html>',       'Missing DOCTYPE'],
            ['</html>',               'Missing closing html tag'],
            ['WebSocket',             'Missing WebSocket client code'],
            ['handleBinary',          'Missing binary frame handler'],
            ['createImageBitmap',     'Missing ImageBitmap renderer'],
            ['ResizeObserver',        'Missing ResizeObserver'],
            ['reconnDelay',           'Missing reconnect backoff'],
            ['exponential',           'Missing backoff comment OR'],
            ['Math.min',              'Missing backoff cap'],
            ['_qualTimer',            'Missing quality debounce'],
            ['START_SILENT_VNC',      'Missing Silent VNC command'],
            ['START_VNC',             'Missing VNC command'],
            ['setReader',             'Missing reader toggle function'],
            ['Reader V2',             'Missing reader V2 UI label'],
            ['toggleFullscreen',      'Missing fullscreen function'],
            ['canvasFocused',         'Missing canvas focus tracking'],
          ];
          let fail = 0;
          required.forEach(([needle, msg]) => {
            if (!html.includes(needle)) { console.error('FAIL:', msg); fail++; }
          });
          if (fail) process.exit(1);
          console.log('HTML validation OK (' + required.length + ' checks)');
          "

      # ── Smoke test: server starts + responds ──
      - name: Smoke test server
        run: |
          node server.js &
          SERVER_PID=$!

          # Wait for server to be ready (max 8s)
          for i in $(seq 1 16); do
            curl -sf http://localhost:5000/health > /dev/null 2>&1 && break
            sleep 0.5
          done

          # /health must return JSON with status:ok
          HEALTH=$(curl -sf http://localhost:5000/health)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            if (d.status !== 'ok') throw new Error('health.status != ok');
            if (typeof d.uptime !== 'number') throw new Error('missing uptime');
            if (!d.devices) throw new Error('missing devices');
            console.log('Health check passed');
          "

          # /api/devices must return devices array
          DEVICES=$(curl -sf http://localhost:5000/api/devices)
          echo "Devices response: $DEVICES"
          echo "$DEVICES" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            if (!Array.isArray(d.devices)) throw new Error('devices is not array');
            console.log('Device list check passed');
          "

          # Frontend must serve HTML with our title
          FRONT=$(curl -sf http://localhost:5000/)
          echo "$FRONT" | grep -q 'C2 Dashboard' || (echo 'FAIL: frontend title missing' && exit 1)
          echo "Frontend check passed"

          # Verify WebSocket endpoint exists (HTTP 101 upgrade)
          WS_CODE=$(curl -so /dev/null -w "%{http_code}" \
            -H "Connection: Upgrade" \
            -H "Upgrade: websocket" \
            -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
            -H "Sec-WebSocket-Version: 13" \
            http://localhost:5000/panel 2>/dev/null || true)
          # 101 = upgrade accepted, 400 = handshake rejected (still means endpoint exists)
          if [ "$WS_CODE" = "101" ] || [ "$WS_CODE" = "400" ]; then
            echo "WebSocket endpoint check passed (HTTP $WS_CODE)"
          else
            echo "WARNING: WebSocket check returned $WS_CODE"
          fi

          kill $SERVER_PID 2>/dev/null || true
          echo "All smoke tests passed"
        timeout-minutes: 2

  # ──────────────────────────────────────────
  #  Security audit
  # ──────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm audit --audit-level=high || true
        # non-blocking: inform but don't fail build on low severity

  # ──────────────────────────────────────────
  #  Docker build verification
  # ──────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rat-dashboard:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Verify Docker image starts
        run: |
          docker run -d --name c2test -p 5000:5000 rat-dashboard:ci-${{ github.sha }}
          sleep 4
          curl -sf http://localhost:5000/health | grep -q '"status":"ok"'
          docker stop c2test
          echo "Docker smoke test passed"
